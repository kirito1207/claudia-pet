<!doctype html>
<html><head><meta charset="utf-8">
<style>
@property --aura { syntax: '<color>'; inherits: true; initial-value: #ffd9b0; }
/* --k：文字区域（气泡、名牌、额度）相对人物再放大多少，外壳调 setSizes 设；锁着时 1 */
:root { --aura: #ffd9b0; --aura-o: .35; --k: 1; }
html, body { margin: 0; background: transparent; overflow: hidden; -webkit-user-select: none; cursor: default;
  font-family: -apple-system, "PingFang SC", sans-serif; }
/* 从下往上排：底栏（名牌 + 额度）固定高度贴着窗口底边，人物在它上面，气泡从人物头顶往上长。
   这样名牌开关、额度有几行、台词有多长，人物都不挪位置，额度也不会被长台词挤出窗口
   （Windows 上微软雅黑行高大，之前开着名牌、台词折两三行时额度会被挤出去） */
#wrap { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100vh; }
#wrap > * { flex-shrink: 0; }
/* 底栏最小高度按 max(1, k)：字比人小时不缩，人物不往下掉 */
#foot { min-height: calc(62px * max(1, var(--k))); flex-shrink: 0; display: flex; flex-direction: column; align-items: center; }
#bubble { position: relative; z-index: 3; margin-bottom: calc(-10px * var(--k)); max-width: calc(228px * var(--k)); min-height: calc(18px * var(--k));
  margin-top: calc(4px * var(--k)); padding: calc(5px * var(--k)) calc(11px * var(--k)); border-radius: calc(12px * var(--k));
  background: rgba(255,255,255,.95); border: calc(1.5px * var(--k)) solid var(--accent, #e0b48a); color: #4a2418;
  font-size: calc(13px * var(--k)); line-height: 1.35; text-align: center; box-shadow: 0 2px 6px rgba(0,0,0,.12);
  transition: opacity .3s, transform .3s; }
#bubble.hide { opacity: 0; transform: translateY(4px); }
#stage { position: relative; width: 250px; height: 241px; transition: transform .32s ease, opacity .32s ease; }
#stage.swap { transform: scale(.9) translateY(4%); opacity: 0; }
#aura { position: absolute; left: 50%; top: 50%; width: 240px; height: 240px; margin: -120px 0 0 -120px;
  border-radius: 50%; opacity: var(--aura-o);
  background: radial-gradient(circle closest-side, var(--aura) 0%, color-mix(in srgb, var(--aura) 45%, transparent) 45%, transparent 100%);
  transition: --aura 0.8s, opacity .8s; animation: pulse 3s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.04); } }
/* 背景光晕：浅色背景上是柔和的氛围，深色背景上会变成一圈发亮的圆盘（像佛光）。
   html 上的 aura-on / aura-off 由宿主按右键菜单的选择设；都没有（自动）时跟着系统深浅色，深色模式下不显示 */
html.aura-off #aura, html.aura-off .aura-rings { display: none; }
@media (prefers-color-scheme: dark) { html:not(.aura-on) #aura, html:not(.aura-on) .aura-rings { display: none; } }
#shadow { position: absolute; left: 50%; bottom: 7px; width: 110px; height: 10px; margin-left: -55px;
  border-radius: 50%; background: rgba(0,0,0,.13); }
#impact { position: absolute; inset: 0; transform-origin: 50% 94%; }
#body { position: absolute; left: 17.8%; top: 21.1%; width: 64.5%; height: 75%; transform-origin: 50% 100%; }
/* The host already moves the whole window: avoid a second moving/resampled body inside it. */
html.clicking #body { animation-play-state: paused !important; }
html.moving #body { animation: none !important; transform: none !important; }
html.moving #body img { transition: none !important; }
html.moving #cards .scard { animation: none !important; }
/* 立绘按高度占满人物框；比框宽的（张开翅膀、带小帮手、抱大碗……）往左右多伸出去，最多到整个舞台宽，
   而不是整体缩小——这样所有姿态里人物一样高 */
#body img { position: absolute; top: 0; bottom: 0; left: -27.5%; width: 155%; height: 100%; object-fit: contain; object-position: 50% 100%;
  opacity: 0; transition: opacity .35s ease; }
#body img.on { opacity: 1; }
#body img#blink { transition: none; }
html.flipping #body img, html.flipping #body canvas.sheet { transition: none; }   /* 补帧翻页：硬切，不交叉淡入（淡入时前后两帧叠在一起像重影）；从动画换过来时动画画布也直接消失 */
/* 动画动作（claude-pet 动作包的精灵图，逐帧画到 canvas 上）：两块画布轮流交叉淡入；播放时静态立绘淡出 */
#body canvas.sheet { position: absolute; pointer-events: none; opacity: 0; transition: opacity .35s ease; }
#body canvas.sheet.on { opacity: 1; }
html.sheet-on #body img { opacity: 0 !important; }
html.moving #body canvas.sheet { transition: none !important; }
#fx { position: absolute; inset: 0; transition: opacity .3s; pointer-events: none; }
/* 闲着久了：身边的特效淡出（见「特效省电」） */
#fx.rest { opacity: 0; transition: opacity 1.2s; }
/* 看不见（被挡住、锁屏）：所有动画暂停 */
html.frozen *, html.frozen *::before, html.frozen *::after { animation-play-state: paused !important; }
/* 多会话：每个正在干活的对话一张小卡片，放在桌宠两侧 / 四个角 */
#cards { position: absolute; inset: 0; pointer-events: none; }
.scard { position: absolute; width: 66px; height: 56px; transition: left .35s ease, top .35s ease, opacity .35s ease, transform .35s ease; opacity: 0; transform: scale(.6); }
.scard.on { opacity: .72; transform: scale(.92); }
.scard.on.focus { opacity: 1; transform: scale(1.06); }
.scard svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 1px 2px rgba(0,0,0,.18)); }
.scard .badge { position: absolute; right: -4px; bottom: -2px; width: 20px; height: 20px; border-radius: 50%; color: #fff; font: bold 13px/20px sans-serif; text-align: center; opacity: 0; transform: scale(.4); transition: opacity .25s, transform .25s; }
.scard.done .badge { background: #3dbb6a; opacity: 1; transform: none; }
.scard.error svg { filter: drop-shadow(0 0 3px #ff5a5a); }
.scard.error { animation: cardShake .45s ease 2; }
.scard.ask { animation: cardBounce .9s ease-in-out infinite; }
@keyframes cardShake { 25% { translate: -4px 0; } 75% { translate: 4px 0; } }
@keyframes cardBounce { 50% { translate: 0 -5px; } }
#more { position: absolute; right: 2px; bottom: 6px; padding: 1px 7px; border-radius: 9px; background: rgba(255,255,255,.9); color: #4a2418;
  font: bold 11px/16px sans-serif; box-shadow: 0 1px 3px rgba(0,0,0,.15); opacity: 0; transition: opacity .3s; }
#more.on { opacity: 1; }

#fx.hide { opacity: 0; }
#fx svg { width: 100%; height: 100%; overflow: visible; }
#poof { position: absolute; left: 50%; top: 55%; width: 0; height: 0; pointer-events: none; }
#poof i { position: absolute; width: 46px; height: 46px; margin: -23px; border-radius: 50%; background: #fff;
  box-shadow: 0 0 0 2px rgba(74,36,24,.25); opacity: 0; }
#poof.go i { animation: puff .6s ease-out forwards; }
@keyframes puff { 0% { opacity: .95; transform: translate(0,0) scale(.3); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.3); } }
.m-dash  { animation: dash 2.2s ease-in-out forwards; }
.m-leave { animation: leave 1s ease-in forwards; }
@keyframes leave { 0% { transform: none; } 100% { transform: translateX(28%) rotate(4deg); opacity: 0; } }
@keyframes dash { 0%, 55% { transform: none; } 100% { transform: translateX(28%) rotate(4deg); opacity: 0; } }
/* 名牌和额度不垫白底：透明背景，字带一圈白色描边，落在 Claude 窗口浅色、深色背景上都看得清 */
#caption, #quota { --halo: calc(1px * var(--k)); text-shadow: 0 0 var(--halo) #fff, 0 0 calc(var(--halo) * 2) #fff, 0 0 calc(var(--halo) * 3) rgba(255,255,255,.9), 0 0 calc(var(--halo) * 4) rgba(255,255,255,.7); }
#caption { margin-top: calc(-2px * var(--k)); padding: calc(2px * var(--k)) calc(9px * var(--k)); border-radius: calc(8px * var(--k)); background: transparent;
  color: #6b4a3a; font-weight: 600; font-size: calc(11px * var(--k)); min-height: calc(14px * var(--k));
  max-width: calc(236px * var(--k)); box-sizing: border-box; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#caption:empty { visibility: hidden; }
html.no-name #caption { display: none; }
#quota { max-width: calc(236px * var(--k)); text-align: center; line-height: 1.35; margin-top: calc(2px * var(--k)); padding: calc(1px * var(--k)) calc(8px * var(--k));
  border-radius: calc(7px * var(--k)); background: transparent; color: #6b4a3a; font-weight: 600; font-size: calc(10px * var(--k)); }
#quota:empty { display: none; }
#quota div { white-space: nowrap; }
#quota.low { color: #c0392b; background: transparent; }
#quota .notice { color: #6b4a3a; font-weight: 600; }   /* 重置提醒那一行：不跟着额度紧张变红 */
/* 额度条样式（quota-bars.js）：每个额度一行——名字、条、剩余百分比、重置时间；条按剩余分三档变色 */
#quota.bars:not(:empty) { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; text-align: left; min-width: calc(170px * var(--k)); }
#quota .qbar { display: contents; white-space: nowrap; }   /* 一行四格：名字、条、百分比、时间，各行对齐成表 */
#quota.bars > div:not(.qbar) { grid-column: 1 / -1; }   /* 文字行（余额）、重置提醒、峰谷条、备注占满一行 */
#quota .ql { padding-right: calc(4px * var(--k)); white-space: nowrap; }
#quota .qtrack { min-width: calc(30px * var(--k)); height: calc(5px * var(--k)); border-radius: calc(3px * var(--k)); background: #e4dcd6; overflow: hidden; }
#quota .qtrack i { display: block; height: 100%; border-radius: inherit; background: var(--bar); }
#quota .qp { padding-left: calc(4px * var(--k)); font-weight: 700; color: var(--bar); text-align: right; white-space: nowrap; }
#quota .qt { padding-left: calc(4px * var(--k)); font-size: calc(8.5px * var(--k)); color: #a8958a; white-space: nowrap; }
#quota .qc.qbarcell { display: flex; align-items: center; gap: calc(3px * var(--k)); }   /* 合并显示里的短条格子 */
#quota .qc.qbarcell .ql { padding-right: 0; }
#quota .qc.qbarcell .qtrack { width: calc(34px * var(--k)); min-width: 0; flex: none; }
#quota.tight .qc.qbarcell .qtrack { width: calc(20px * var(--k)); }   /* 四家都开、并成三格时放不下：条短一点 */
#quota .qc.qbarcell .qp { padding-left: 0; }
#quota .ok { --bar: #4f7fd8; }
#quota .mid { --bar: #e0902f; }
#quota .low { --bar: #c0392b; }
#quota .qnote { font-size: calc(8.5px * var(--k)); color: #a8958a; }
/* 峰谷时段（设置里选款式）。时间条：一天 24 小时，红 = 高峰、绿 = 空闲，竖线 = 现在（北京时间）；颜色要够深，浅色桌面上也看得清 */
#quota .peak { padding: calc(2px * var(--k)) 0 0; }
#quota .peakbar { position: relative; width: calc(150px * var(--k)); height: calc(6px * var(--k)); margin: 0 auto; border-radius: calc(3px * var(--k)); overflow: hidden; background: #7cc493; box-shadow: inset 0 0 0 calc(.5px * var(--k)) rgba(74,36,24,.35); }
#quota .peakbar i { position: absolute; top: 0; bottom: 0; }
#quota .peakbar i.peak-on { background: #ec8174; }
#quota .peakbar i.valley-on { background: #7cc493; }
#quota .peaknow { position: absolute; top: calc(-1px * var(--k)); width: calc(150px * var(--k)); left: 50%; margin-left: calc(-75px * var(--k)); height: calc(8px * var(--k)); pointer-events: none; }
#quota .peaknow b { position: absolute; top: 0; bottom: 0; width: calc(2px * var(--k)); margin-left: calc(-1px * var(--k)); background: #3a2219; border-radius: 1px; box-shadow: 0 0 0 calc(1px * var(--k)) #fff; }
#quota .peakwrap { position: relative; }
#quota .peakticks { position: relative; width: calc(150px * var(--k)); height: calc(11px * var(--k)); margin: 0 auto; font-size: calc(8px * var(--k)); color: #6b4a3a; }
#quota .peakticks span { position: absolute; top: 0; transform: translateX(-50%); }
#quota .peakticks span:first-child { transform: none; }
#quota .peakticks span:last-child { transform: translateX(-100%); }
/* 文字款：一行「● 高峰」或「● 空闲」 */
#quota .peaktext { font-weight: 600; }
#quota .peaktext.peak-on { color: #dc5f51; }
#quota .peaktext.valley-on { color: #4aa265; }
#quota .peaktext::before { content: ''; display: inline-block; width: calc(7px * var(--k)); height: calc(7px * var(--k)); margin-right: calc(4px * var(--k)); border-radius: 50%; background: currentColor; vertical-align: calc(.5px * var(--k)); }
/* 额度合并显示：一家 AI 一行，名字一列、每个额度窗口一列（quota-aggregate.js），只有紧张的百分比变红 */
#quota.agg:not(:empty) { display: grid; justify-content: center; text-align: left; font-variant-numeric: tabular-nums; }
#quota .qn { white-space: nowrap; padding-right: calc(7px * var(--k)); font-weight: 600; }
#quota .qc { white-space: nowrap; padding: 0 calc(6px * var(--k)); }
#quota .qn + .qc { padding-left: 0; }
#quota .qc + .qc { border-left: 1px solid rgba(107,74,58,.25); }
#quota .qc .low { color: #c0392b; font-weight: 700; }
/* 四家都有时 4 行要塞进底栏（#foot 的 62px 预算里额度小窗最多约 43px），人物才不会被顶上去；字放大时预算也按 k 放大 */
#quota.tight { font-size: calc(9px * var(--k)); line-height: 1.1; }
#quota.tight .qc { padding: 0 calc(4px * var(--k)); }
#quota.tight .qn { padding-right: calc(5px * var(--k)); }

/* 身体动作：切换时用 animation 平滑接上 */
.m-bob   { animation: bob 3.2s ease-in-out infinite; }
.m-hop   { animation: bob-big .8s ease-in-out infinite; }
.m-jump  { animation: jump .7s ease-in-out infinite; }
.m-quick { animation: bob-small .45s ease-in-out infinite; }
.m-rock  { animation: rock 3s ease-in-out infinite; }
.m-sway  { animation: rock 1.8s ease-in-out infinite; }
.m-slow  { animation: bob-tiny 4.5s ease-in-out infinite; }
.m-shake { animation: shake 1.4s ease-in-out infinite; }
/* 红温：浑身发抖、泛红光；被甩晕：东倒西歪 */
.m-angry { animation: angry .14s linear infinite; }
.m-angry img { filter: drop-shadow(0 0 7px rgba(255, 60, 30, .75)) saturate(1.15); }
.m-dizzy { animation: dizzy 1.1s ease-in-out infinite; }
/* 被扔出去碰边：和 m-jolt 一样先演一下开场，再接一直循环的轻微动作（不会停住）。
   循环动作都从不变形开始，接开场的结尾时不会跳一下；摇晃以脚为支点（#body 的 transform-origin 在脚下） */
.m-bonk    { animation: bonk .5s cubic-bezier(.3,1.6,.5,1) 1, wince 1.8s ease-in-out .5s infinite; }
.m-stagger { animation: stagger 1.2s ease-in-out 1, wobble 1.5s ease-in-out 1.2s infinite; }
.m-fallen  { animation: plop .45s ease-out 1, breathe 3.4s ease-in-out .45s infinite; }
.m-faceplant { animation: flop .5s ease-out 1, breathe 4s ease-in-out .5s infinite; }
@keyframes bonk { 0% { transform: translateY(2%) scale(1.05,.92); } 45% { transform: translateY(-1%) scale(.97,1.04); } 100% { transform: none; } }
@keyframes wince { 0%, 100% { transform: none; } 50% { transform: translateY(.6%) scale(1.01,.985); } }
@keyframes stagger { 0%, 100% { transform: rotate(0); } 18% { transform: rotate(-7deg); } 42% { transform: rotate(6deg); } 66% { transform: rotate(-4deg); } 86% { transform: rotate(2deg); } }
@keyframes wobble { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-2.5deg); } 75% { transform: rotate(2.5deg); } }
@keyframes plop { 0% { transform: translateY(-5%) scale(.96,1.05); } 45% { transform: scale(1.07,.91); } 75% { transform: scale(.99,1.02); } 100% { transform: none; } }
@keyframes flop { 0% { transform: translateY(-6%) scale(.95,1.08); } 40% { transform: scale(1.06,.86); } 70% { transform: scale(.99,1.03); } 100% { transform: none; } }
@keyframes breathe { 0%, 100% { transform: none; } 50% { transform: scale(1.008,1.022); } }
@keyframes rise { 0% { transform: translateY(4%) scale(1.04,.93); } 60% { transform: translateY(-2%) scale(.98,1.03); } 100% { transform: none; } }
/* 多会话时被甩：小卡片东倒西歪 */
#cards.shaken .scard { animation: card-wobble .22s ease-in-out 4 alternate; }
#cards.shaken .scard:nth-child(even) { animation-direction: alternate-reverse; }
@keyframes card-wobble { from { transform: scale(.92) translate(-5px, 2px) rotate(-16deg); } to { transform: scale(.92) translate(5px, -3px) rotate(16deg); } }
@keyframes angry { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(-1.2%, .4%); } 50% { transform: translate(1.2%, -.4%); } 75% { transform: translate(-.8%, -.3%); } }
@keyframes dizzy { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
.m-squish{ animation: squish 1.6s ease-in-out infinite; }
.m-gift  { animation: gift .65s cubic-bezier(.3,1.6,.5,1) 1, bob-big 1.1s ease-in-out .65s infinite; }
.m-jolt  { animation: jolt .55s cubic-bezier(.3,1.6,.5,1) 1, bob 3.2s ease-in-out .55s infinite; }
@keyframes bob { 50% { transform: translateY(-2.5%); } }
@keyframes bob-big { 50% { transform: translateY(-5%); } }
@keyframes bob-small { 50% { transform: translateY(-1.8%); } }
@keyframes bob-tiny { 50% { transform: translateY(-.8%) scale(1.01, 1.015); } }
@keyframes jump { 0%,100% { transform: translateY(0) scale(1.02,.98); } 50% { transform: translateY(-9%) scale(.98,1.02); } }
@keyframes rock { 0%,100% { transform: rotate(-2.5deg); } 50% { transform: rotate(2.5deg); } }
@keyframes shake { 0%,50%,100% { transform: translateX(0); } 10% { transform: translateX(-3%); } 20% { transform: translateX(3%); }
  30% { transform: translateX(-2%); } 40% { transform: translateX(2%); } }
@keyframes squish { 50% { transform: scale(.96, 1.05); } }
@keyframes gift { 0% { transform: translateY(3%) scale(1.05,.93); } 45% { transform: translateY(-9%) scale(.97,1.04); } 100% { transform: none; } }
@keyframes jolt { 0% { transform: translate(0,0) rotate(0); } 25% { transform: translate(-3%, -4%) rotate(-4deg) scale(.97,1.04); } 60% { transform: translate(1%, 0) rotate(1.5deg); } 100% { transform: none; } }
</style></head>
<body>
<div id="wrap">
  <div id="bubble" class="hide"></div>
  <div id="stage">
    <div id="aura"></div><div id="shadow"></div>
    <div id="impact"><div id="body"><img id="a" class="on"><img id="b"><img id="blink"><canvas class="sheet" id="sheetA"></canvas><canvas class="sheet" id="sheetB"></canvas></div></div>
    <div id="fx"></div>
    <div id="cards"><div id="more"></div></div>
    <div id="poof"><i style="--dx:-60px;--dy:-30px"></i><i style="--dx:55px;--dy:-35px"></i><i style="--dx:-45px;--dy:40px"></i><i style="--dx:50px;--dy:35px"></i><i style="--dx:0;--dy:-60px"></i></div>
  </div>
  <div id="foot"><div id="caption"></div><div id="quota"></div></div>
</div>
<script>
addEventListener('error', e => {
  if (!(e.target && e.target.tagName === 'IMG' && e.target.src)) return
  window.chrome?.webview?.postMessage({ imageError: e.target.src })
}, true)
// 脚本出错：交给外壳记进日志（Claudia 加的，方便发现删改后漏掉的引用）
addEventListener('error', e => {
  if (e.target && e.target.tagName) return   // 图片之类的资源错误上面处理
  window.chrome?.webview?.postMessage({ jsError: `${e.message} @ ${(e.filename || '').split('/').pop()}:${e.lineno}` })
})
addEventListener('unhandledrejection', e => window.chrome?.webview?.postMessage({ jsError: 'promise: ' + (e.reason?.message || e.reason) }))
</script>
<script src="effects.js"></script>
<script src="text-size.js"></script>
<script src="quota-bars.js"></script>
<script src="dsh-physics.js"></script>
<script src="pet-motion.js"></script>
<script src="idle-policy.js"></script>
<script src="click-sequence.js"></script>
<script src="motion-mood.js"></script>
<script src="tumble.js"></script>
<script>
// Claudia 画面：由 Windows 外壳（Claudia.exe）调用这几个函数
//   init(manifest)          角色清单（characters/*/character.json + 立绘）
//   setCharacter(id)        设定角色（Claudia 只有 Claude 娘）
//   applyCharState(id, s)   Claude 的工作状态（插件写的 claude-state.json）
//   setQuota(id, q, at)     Claude 的额度（插件写的 claude-quota.json；at 是它的修改时间，秒）
//   setQuotaStyle(s)        额度怎么显示：'text' 文字（默认）/ 'bars' 额度条（quota-bars.js）
//   handleClick(kind)       单击 = pat（摸摸头），右键菜单「戳一下」= poke

const MOTION = {

      else complain('shakeWork', ['别晃啦，我在干活呢！'])
    }
    return // Work and unanswered questions retain priority; keep the emotion for later.
  }
  angerNow() // Freeze accumulated anger until its response can actually be seen.
  const pending = motionMood.take()
  if (!pending) return
  if (angerLevel(anger) || sulking) {
    if (sulking && anger >= 75) sulking = false // Replay an interrupted red-hot sequence in full.
    react(pending.afterWork)
  } else if (!tumbled) show('dizzy', true)
  tumbled = false
}
// 甩停了：回到手上的活（AI 最新的那个动作；不换台词，抱怨还留在气泡里）
function resumeWork() {
  if (aiActivity() !== 'work') return react()
  const p = charState[charId].pose
  setPose(p === 'listening' ? 'thinking' : p)
  shownAt = Date.now()
}
// AI 现在在干嘛：'asking'（等你回答）/ 'work'（干活）/ null（闲着）。看 AI 写来的最新状态，太久没动静的不算
function aiActivity() {
  const s = charState[charId]
  if (!s?.pose || Date.now() / 1000 - (s.ts || 0) > STUCK_AFTER / 1000) return null
  if (pose === 'idle' || pose === 'sleeping' || pose === 'tired') return null   // 卡住的状态被兜底送回待机了
  if (s.pose === 'asking') return 'asking'
  return NOT_WORKING.has(s.pose) ? null : 'work'
}
// 抱怨一句：同一种 4 秒内只说一次，3.5 秒后收起
const complainedAt = {}
let complainTimer = null, wobbleTimer = null, shakingUntil = 0
function complain(key, fallback) {
  if (Date.now() - (complainedAt[key] || 0) < 4000) return
  complainedAt[key] = Date.now()
  const line = pick(linesOf(key) || fallback)
  say(line)
  clearTimeout(complainTimer)
  complainTimer = setTimeout(() => { if ($('bubble').textContent === line) say('') }, 3500)
}
function wobbleCards() {
  const c = $('cards')
  c.classList.remove('shaken'); void c.offsetWidth; c.classList.add('shaken')   // 重新触发动画
  clearTimeout(wobbleTimer)
  wobbleTimer = setTimeout(() => c.classList.remove('shaken'), 1000)
}
function coaxHer() {
  if (sulking) {
    if (++coax >= 3) return forgive()
    showSay('coaxed')
    return
  }
  anger = Math.max(0, anger - 25); angerAt = Date.now()
  showSay(angerLevel(anger) ? 'coaxed' : 'forgiven')
}
function forgive() {
  motionMood.clear()
  sulking = false; coax = 0; anger = 0; angerAt = Date.now()
  clearTimeout(sulkTimer)
  show('forgiven', true)
}


// ---- 被扔出去碰边：撞头 / 摇晃 → 趴地 / 摔倒（判断在 tumble.js）；倒地演完直接站回去：没火气说一句 getup 台词，有火气直接接生气 ----
// 撞头在撞上那一刻换图，停稳后再保持一会儿；碰底边先记下，停稳后才开始演（弹跳、滑行时保持原样）。
// 身体动作演完再结算情绪（resolveMotionMood 会等）；演过就不再演「晕乎乎」。
// Claude 在干活：只闪 0.8 秒就回去干活；在等回答：不换图，只说一句；多个会话在忙：不触发。
// 演到一半被拖走、别的状态把图换掉、或在设置里关掉：直接中断。
const tumblePolicy = new TumblePolicy()
const TUMBLE_FLASH = 800
let tumbleOn = true, tumble = null, tumbled = false
const isMoving = () => document.documentElement.classList.contains('moving')
function tumbleHit(m) {
  if (!tumbleOn || tumble || !m.edge || m.phase === 'drag' || farewellLine !== null || multi) return
  const speed = m.edge === 'left' || m.edge === 'right' ? m.impactX : m.impactY
  const kind = tumblePolicy.hit(m.edge, speed)
  if (!kind) return
  tumbled = true
  const context = moodContext()
  if (context === 'asking') { complain('tumbleAsk', ['好痛…']); return }
  clearTimeout(pending); clearTimeout(revertTimer)
  // 被晃出火气（或正在赌气）时说生气版台词（bonkAngry …），和爬起来之后的发火接得上
  tumble = { kind, steps: TumblePolicy.STEPS[kind], i: -1, flash: context === 'work', pose: null, timer: null,
    angry: sulking || !!angerLevel(angerNow()) }
  if (kind === 'bonk') tumbleStep()
}
function tumbleStep() {
  const t = tumble
  if (!t) return
  clearTimeout(t.timer)
  const step = t.steps[++t.i]
  if (!step || (t.flash && t.i > 0)) return tumbleFinish()
  const [p, ms] = step
  setPose(p); shownAt = Date.now(); t.pose = p
  const lines = (t.angry && linesOf(p + 'Angry')) || linesOf(p); say(lines ? pick(lines) : '')
  if (t.flash) t.timer = characterTimeout(tumbleFinish, TUMBLE_FLASH)
  else if (!isMoving()) t.timer = characterTimeout(tumbleNext, ms)
}
// 下一段之前确认图还是她的：被新的工作、提问之类换掉了就不再接着演
function tumbleNext() { if (tumble && pose === tumble.pose) tumbleStep(); else tumbleFinish(true) }
function tumbleLanded() {
  const t = tumble
  if (!t) return
  if (t.i < 0) tumbleStep()
  else if (!t.flash) { clearTimeout(t.timer); t.timer = characterTimeout(tumbleNext, t.steps[t.i][1]) }
}
// 坐着、趴着时单击 = 扶她起来（马上站回去）；其他时候点她不打断
const ON_FLOOR = new Set(['fallen', 'faceplant'])
function tumbleHelpUp() {
  const t = tumble
  if (!t || t.flash || !ON_FLOOR.has(pose)) return
  tumbleFinish()
}
function tumbleBack(standUp, angry) {
  say('')
  const s = charState[charId]
  if (moodContext() === 'work') { setPose(s.pose === 'listening' ? 'thinking' : s.pose); shownAt = Date.now() }
  else setPose(restPose())
  if (!standUp) return
  tumbleStandUp()
  if (angry) return   // 有火气：直接接生气动作，台词用它自己的
  const lines = linesOf('getup'); if (lines) say(pick(lines))   // 「嘿咻…」「没事没事…」
}
// 从地上换回站着的图：和交叉淡入同时，从低处往上伸展一下再回原样，看起来是「站起来」而不是一下跳成站直。
// 动画加在外层 #impact 上（落地压扁也用它），所以不管换回待机还是干活的样子都一样
function tumbleStandUp() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return
  impactAnimation?.cancel()
  impactAnimation = $('impact').animate([
    { transform: 'translateY(7%) scale(1.04,.88)' },
    { transform: 'translateY(-2.5%) scale(.97,1.05)', offset: .55 },
    { transform: 'translateY(.5%) scale(1.01,.99)', offset: .8 },
    { transform: 'none' }
  ], { duration: 520, easing: 'ease-out' })
}
function tumbleFinish(interrupted) {
  const t = tumble
  if (!t) return
  clearTimeout(t.timer); tumble = null
  if (!interrupted && pose === t.pose) tumbleBack(ON_FLOOR.has(t.pose), t.angry)
  motionMood.attempt()
}
function tumbleCancel() {
  const t = tumble
  if (!t) return
  clearTimeout(t.timer); tumble = null
  if (t.pose && pose === t.pose) tumbleBack()
}

// Idle behavior is configurable and never interrupts work, dragging or explicit interactions.
let idleSettings = IdlePolicy.normalize({}), idleTimer = null, clickBounce = true
function setBehavior(settings) {
  idleSettings = IdlePolicy.normalize(settings); clickBounce = settings?.clickBounce !== false
  if (!clickBounce) clickSequence.cancel()
  tumbleOn = settings?.tumbleActions !== false
  if (!tumbleOn) tumbleCancel()
  const wasAnim = animOn
  animOn = settings?.animatedSprites !== false
  if (wasAnim !== animOn) refreshAnim()
  scheduleIdle()
}
function scheduleIdle() {
  clearTimeout(idleTimer)
  idleTimer = setTimeout(() => { idleTick(); scheduleIdle() }, IdlePolicy.delay(idleSettings))
}
function idleTick() {
  const quiet = Date.now() - lastActive
  // 动画小动作按组跟着「允许的动作」走，when 限定时段 / 季节 / 节气；余额钱袋算 Claude 梗，只演当前这一档
  const extra = idleAnimations(), groupOf = {}, weightOf = {}
  for (const p of extra) { const a = char().animations[p]; groupOf[p] = a?.idle || 'claude'; weightOf[p] = a?.weight || 1 }
  const available = IdlePolicy.candidates(idleSettings, { pose, quiet, extra, available: ['hum','stretch','yawn','clawd'].filter(canShow),
    hidden: pageHidden, moving: document.documentElement.classList.contains('moving'), working: !!aiActivity(), multi: !!multi,
    farewell: farewellLine !== null, clicking: clickSequence.busy || motionMood.pending || !!tumble })
  if (!available.length) return
  if (quiet > SLEEP_AFTER) { setPose('sleeping'); say(pick(linesOf('sleeping') || [''])); return }
  // 先在组里平均抽一组，再在组里按 weight 抽一个：动画小动作很多，不能把哼歌、伸懒腰这些挤掉；当天的节气动作权重高
  const groups = [...new Set(available.map(p => groupOf[p] || p))], g = pick(groups)
  const inGroup = available.filter(p => (groupOf[p] || p) === g)
  let roll = Math.random() * inGroup.reduce((n, p) => n + (weightOf[p] || 1), 0), action = inGroup[inGroup.length - 1]
  for (const p of inGroup) { roll -= weightOf[p] || 1; if (roll < 0) { action = p; break } }
  if (anim(action)?.walk) { if (startWalk(action)) return; }
  if (!TRANSIENT[action]) TRANSIENT[action] = 4000
  show(action, true)
}
function idleAnimations(d = new Date()) {
  const out = Object.entries(char()?.animations || {}).filter(([p, a]) => a.idle && idleSettings.actions.includes(a.idle) && whenOk(a.when, d) && anim(p)).map(([p]) => p)
  const tier = quotaTier(quota[charId]); if (tier && idleSettings.actions.includes('claude') && anim(tier)) out.push(tier)
  return out
}
scheduleIdle()

// 想得久了换成专属的「深度思考」：character.json 里 longThink: { after: 秒, pose: 姿态 }
setInterval(() => {
  const lt = char()?.longThink
  if (!lt || pose !== 'thinking' || !canShow(lt.pose)) return
  if (Date.now() - poseSince > (lt.after || 20) * 1000) show(lt.pose, true)
}, 1000)


// ---- 生动一点：同一状态有多张图时停留久了换一张；有眨眼帧就偶尔眨眼 ----
setInterval(() => {
  if (sheet || char()?.frames?.[pose]) return   // 正在播动画 / 这个姿态按顺序翻页
  const frames = framesFor(pose)
  if (frames.length > 1 && Date.now() - poseSince > 8000) {
    poseSince = Date.now()
    showImage(pick(frames.filter(u => u !== currentUrl)))
  }
}, 2000)
;(function blinkLoop() {
  setTimeout(() => {
    const blink = $('blink'), c = char()
    // 只在显示的正是眨眼帧对应的那张 idle、而且换图淡入已经结束时眨眼，否则会和别的图叠在一起
    if (c && c.blink && c.blinkBase && (pose === 'idle' || pose === 'listening') && currentUrl === c.blinkBase
        && active.getAttribute('src') === c.blinkBase && !spare.classList.contains('on') && Date.now() - swappedAt > 600) {
      blink.classList.add('on')
      setTimeout(() => blink.classList.remove('on'), 140)
    }
    blinkLoop()
  }, 3000 + Math.random() * 3500)
})()
const motionMood = new MotionMood(resolveMotionMood)
const clickSequence = new ClickSequence(done => {
  impactAnimation?.cancel()
  const animation = $('impact').animate([
    { transform: 'scale(1)' },
    { transform: 'scale(1.045,.9)', offset: .35 },
    { transform: 'scale(.99,1.025)', offset: .75 },
    { transform: 'scale(1)' }
  ], { duration: 220, easing: 'ease-out' })
  animation.onfinish = done
  return () => { animation.onfinish = null; animation.cancel() }
}, active => { document.documentElement.classList.toggle('clicking', active); if (!active) queueMicrotask(() => motionMood.attempt()) })
// Browser frame loop mirrors dsh-pet's desktop renderer; the host is only a bounds broker.
const petMotion = new PetMotion(DshPhysics, message => {
  dragSheet(message)
  tumbleHit(message)
  window.chrome?.webview?.postMessage({ motion: message })
}, callback => requestAnimationFrame(callback), id => cancelAnimationFrame(id), () => performance.now())
</script>
</body></html>
